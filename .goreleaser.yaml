version: 2

project_name: shevanio-ai

before:
  hooks:
    - go run ./internal/providercontractbundlecmd generate --out .goreleaser-provider-contract

builds:
  - main: ./cmd/shevanio-ai
    binary: shevanio-ai
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X github.com/shevanio/shevanio-ai/v2/internal/update/upgrade.releaseMinisignPublicKeys={{ .Env.MINISIGN_PUBLIC_KEYS_CANONICAL }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/review-integration.md
      - contracts/review-integration/v1/FREEZE.md
      - contracts/review-integration/v1/schemas/*.schema.json
      - contracts/review-integration/v1/fixtures/*.fixture.json
      - contracts/review-integration/v2/schemas/*.schema.json
      - contracts/review-integration/v2/fixtures/*.fixture.json
  - id: review-provider-contract
    meta: true
    formats:
      - tar.gz
    name_template: "shevanio-ai-review-provider-contract-{{ .Env.PROVIDER_CONTRACT_SEMVER }}"
    files:
      - src: .goreleaser-provider-contract/README.md
        strip_parent: true
        info:
          mode: 0644
          mtime: "1970-01-01T00:00:00Z"
      - src: .goreleaser-provider-contract/manifest.json
        strip_parent: true
        info:
          mode: 0644
          mtime: "1970-01-01T00:00:00Z"
      - src: .goreleaser-provider-contract/schemas/*.schema.json
        dst: schemas
        strip_parent: true
        info:
          mode: 0644
          mtime: "1970-01-01T00:00:00Z"
      - src: .goreleaser-provider-contract/vectors/*.json
        dst: vectors
        strip_parent: true
        info:
          mode: 0644
          mtime: "1970-01-01T00:00:00Z"

sboms:
  - artifacts: archive

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Sign only the checksum manifest. The signed trusted comment binds the exact
# repository and tag; the updater rejects a valid signature copied from any
# other release identity.
signs:
  - cmd: minisign
    artifacts: checksum
    signature: ${artifact}.minisig
    args:
      - "-S"
      - "-s"
      - "{{ .Env.MINISIGN_SECRET_KEY_FILE }}"
      - "-m"
      - "${artifact}"
      - "-x"
      - "${signature}"
      - "-c"
      - "signature from shevanio-ai release"
      - "-t"
      - "repo=Shevanio/shevanio-ai;tag={{ .Tag }}"
    output: true

release:
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: Shevanio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    name: shevanio-ai
    homepage: "https://github.com/Shevanio/shevanio-ai"
    description: "Shevanio AI — Ecosystem, Frameworks, Workflows for AI coding agents."
    license: "MIT"
    commit_msg_template: "chore: update shevanio-ai formula to {{ .Tag }}"
