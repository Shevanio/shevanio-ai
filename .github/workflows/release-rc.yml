name: Release candidate

on:
  push:
    tags:
      - "v*-rc.*"

# The called workflow reduces these permissions per job and exposes write
# authority only to GoReleaser after protected-environment approval.
permissions:
  contents: write
  actions: read

jobs:
  release-candidate:
    uses: ./.github/workflows/release.yml
    with:
      release_channel: rc
